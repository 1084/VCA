<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review · Cove Rooms</title>
<meta name="description" content="Owner review of room applications.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0C1518;--surface:#132026;--surface-2:#1A2A31;--line:rgba(232,239,240,.09);--text:#E8EFF0;--muted:#8CA1A7;--amber:#FFB454;--cyan:#7CCFDE;--display:"Bricolage Grotesque",sans-serif;--body:"Inter",sans-serif;--mono:"Spline Sans Mono",monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--cyan)}
.wrap{width:min(960px,100% - 40px);margin:0 auto;padding-bottom:60px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 34px}
.mark{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:19px;color:var(--text);text-decoration:none}
.mark .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px rgba(255,180,84,.7)}
.mark small{font-weight:400;color:var(--muted);font-size:14px}
nav a{color:var(--muted);text-decoration:none;font-size:14px;margin-left:18px}nav a:hover,nav a.on{color:var(--text)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,5vw,42px);letter-spacing:-.02em;line-height:1.1}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 26px}
.lede{color:var(--muted);font-size:17.5px;margin-bottom:30px}
h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em;margin:38px 0 10px}
h3{font-family:var(--display);font-weight:600;font-size:17px;margin:22px 0 6px}
p,li{margin-bottom:12px}ul,ol{padding-left:22px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:18px 0}
.box b{color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:14px 0}td,th{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}
footer{border-top:1px solid var(--line);margin-top:50px;padding-top:18px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer a{color:var(--muted)}
@media (max-width:640px){nav a{margin-left:12px}}
</style></head><body><div class="wrap">
<header><a class="mark" href="/rooms/"><span class="dot"></span>Cove <small>Rooms</small></a>
<nav><a href="/rooms/terms.html">Terms</a><a href="/rooms/conduct.html">Conduct</a><a href="/rooms/privacy.html">Privacy</a><a href="/rooms/help.html">Help</a></nav></header>

<style>
.key{display:flex;gap:8px;margin:0 0 22px}.key input{flex:1;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--text);font:inherit}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font:inherit;font-weight:600;cursor:pointer}.btn.p{background:var(--amber);color:#20160A;border-color:transparent}.btn.d{color:#FFA3A3}
.tabs{display:flex;gap:6px;margin:0 0 14px}.tabs button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;cursor:pointer}.tabs button.on{color:var(--text);border-color:var(--amber)}
.app{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 12px}
.app h3{margin:0 0 4px;font-size:17px}.app .m{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px}
.app dl{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:14.5px;margin:0 0 12px}.app dt{color:var(--muted)}.app dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.app .act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.app .act input{flex:1;min-width:160px;padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px}
.tier{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);margin-left:8px}.tier.studio{border-color:rgba(255,180,84,.5);color:var(--amber)}
.hosts td{padding:6px 10px;border-bottom:1px solid var(--line);font-size:14px}.hosts th{text-align:left;padding:6px 10px;color:var(--muted);font-weight:500;font-size:12px}
#status{color:var(--muted);font-size:13.5px;min-height:1.2em}
</style>
<h1>Applications</h1>
<p class="meta">Owner review · nothing here is public</p>
<div class="key"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button class="btn p" id="go">Open</button><button class="btn" id="forget">Forget key</button></div>
<p id="status"></p>
<div class="tabs"><button data-s="new" class="on">New</button><button data-s="invited">Invited</button><button data-s="declined">Declined</button><button data-s="">All</button></div>
<div id="list"></div>
<h2>Hosts</h2>
<table class="hosts"><thead><tr><th>Email</th><th>Since</th><th>Tier</th><th>Rooms</th><th>Terms</th><th></th></tr></thead><tbody id="hosts"></tbody></table>
<script>
const API = 'https://vca-89mx.onrender.com';
const $ = (s) => document.querySelector(s);
let key = sessionStorage.getItem('cove-admin') || '', tab = 'new';
$('#key').value = key;
const api = async (path, opts = {}) => {
  const r = await fetch(API + '/api/admin/' + path, { ...opts, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + key, ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j;
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = (d) => d ? new Date(d).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
async function load() {
  $('#status').textContent = 'Loading…';
  try {
    const apps = await api('applications' + (tab ? '?status=' + tab : ''));
    $('#list').innerHTML = apps.length ? apps.map((a) => `
      <div class="app" data-id="${a.id}">
        <h3>${esc(a.name)} <span class="tier ${a.tier}">${a.tier}</span></h3>
        <div class="m">${esc(a.email)} · ${when(a.ts)} · ${a.status}${a.decidedAt ? ' ' + when(a.decidedAt) : ''}${a.adminNote ? ' · ' + esc(a.adminNote) : ''}</div>
        <dl><dt>Teaches</dt><dd>${esc(a.teaches)}</dd><dt>Teaches now at</dt><dd>${/^https?:/.test(a.where) ? `<a href="${esc(a.where)}" target="_blank" rel="noopener noreferrer">${esc(a.where)}</a>` : esc(a.where) || '—'}</dd><dt>Bills</dt><dd>${esc(a.billing) || '—'}</dd><dt>Notes</dt><dd>${esc(a.notes) || '—'}</dd></dl>
        <div class="act">
          <a class="btn" href="mailto:${esc(a.email)}?subject=${encodeURIComponent('Cove Rooms: your application')}">Reply</a>
          <input placeholder="Note for yourself (optional)" maxlength="300">
          ${a.status !== 'invited' ? '<button class="btn p" data-do="invited">Invite</button>' : ''}
          ${a.status !== 'declined' ? '<button class="btn d" data-do="declined">Decline</button>' : ''}
          ${a.status !== 'new' ? '<button class="btn" data-do="new">Reopen</button>' : ''}
          <button class="btn d" data-do="delete">Delete</button>
        </div>
      </div>`).join('') : '<p style="color:var(--muted)">Nothing here.</p>';
    const hosts = await api('hosts');
    $('#hosts').innerHTML = hosts.map((h) => `<tr data-email="${esc(h.email)}"><td>${esc(h.email)}</td><td>${h.hostSince ? new Date(h.hostSince).toLocaleDateString() : ''}</td><td>${h.studio ? 'Studio' : 'Room'}</td><td>${h.maxRooms || 1}</td><td>${h.termsAcceptedAt ? '✓' : '—'}</td><td><button class="btn" data-h="studio">${h.studio ? 'Make Room' : 'Make Studio'}</button> <button class="btn d" data-h="revoke">Revoke</button></td></tr>`).join('');
    $('#status').textContent = `${apps.length} application${apps.length === 1 ? '' : 's'} · ${hosts.length} host${hosts.length === 1 ? '' : 's'}`;
  } catch (e) { $('#status').textContent = e.message === 'Unauthorized' ? 'That key was not accepted.' : e.message; }
}
$('#go').onclick = () => { key = $('#key').value.trim(); sessionStorage.setItem('cove-admin', key); load(); };
$('#key').addEventListener('keydown', (e) => e.key === 'Enter' && $('#go').click());
$('#forget').onclick = () => { sessionStorage.removeItem('cove-admin'); key = ''; $('#key').value = ''; $('#list').innerHTML = ''; $('#hosts').innerHTML = ''; $('#status').textContent = ''; };
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => { tab = b.dataset.s; document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b)); load(); });
$('#list').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-do]'); if (!b) return;
  const card = b.closest('.app'), id = card.dataset.id, note = card.querySelector('input').value;
  try {
    if (b.dataset.do === 'delete') { if (!confirm('Delete this application for good?')) return; await api('applications/' + id, { method: 'DELETE' }); }
    else { const r = await api('applications/' + id + '/decide', { method: 'POST', body: JSON.stringify({ status: b.dataset.do, note }) });
      if (b.dataset.do === 'invited') alert(r.becameHost ? 'They already have an account; they are a host now. Tell them to open the lobby.' : 'Invited. They become a host the moment they sign up with this email.'); }
    load();
  } catch (err) { alert(err.message); }
});
$('#hosts').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-h]'); if (!b) return;
  const email = b.closest('tr').dataset.email;
  try {
    if (b.dataset.h === 'revoke') { if (!confirm(`Revoke ${email}? Their rooms are deleted.`)) return; await api('hosts', { method: 'POST', body: JSON.stringify({ email, host: false }) }); }
    else { const studio = b.textContent.includes('Studio'); await api('hosts', { method: 'POST', body: JSON.stringify({ email, studio })); }
    load();
  } catch (err) { alert(err.message); }
});
if (key) load();
</script>

<footer><span>© 2026 John Hubert LLC · Virginia · <a href="https://johnhubert.llc/">johnhubert.llc</a></span><span><a href="mailto:support@johnhubert.llc">support@johnhubert.llc</a></span></footer>
</div></body></html>
